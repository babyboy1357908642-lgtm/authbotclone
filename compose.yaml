services:
  mongo:
    image: mongo:8.0
    restart: unless-stopped
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "quit(db.runCommand({ping: 1}).ok ? 0 : 1)"]
      interval: 10s
      timeout: 5s
      retries: 10
    # No host port: this unauthenticated development database stays on the private compose network.
  bot:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      MONGO_URI: mongodb://mongo:27017
    depends_on:
      mongo:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:size=128m
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "python", "-m", "waifu_bot.health"]
      interval: 30s
      timeout: 10s
      start_period: 45s
      retries: 3
volumes:
  mongo_data:
